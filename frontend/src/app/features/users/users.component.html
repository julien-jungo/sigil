<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold">Users</h1>
    <button
      (click)="showForm.set(!showForm())"
      class="bg-gray-900 text-white text-sm px-4 py-2 rounded-lg hover:bg-gray-700"
    >
      New user
    </button>
  </div>

  @if (showForm()) {
    <form (ngSubmit)="create()" class="bg-white border rounded-xl p-4 mb-6 flex gap-3 items-end">
      <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Username</label>
        <input
          [(ngModel)]="newUsername"
          name="username"
          class="border rounded px-2 py-1 text-sm"
          required
        />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Password</label>
        <input
          [(ngModel)]="newPassword"
          name="password"
          type="password"
          class="border rounded px-2 py-1 text-sm"
          required
        />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500">Role</label>
        <select [(ngModel)]="newRole" name="role" class="border rounded px-2 py-1 text-sm">
          <option value="VIEWER">Viewer</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <button
        type="submit"
        class="bg-gray-900 text-white text-sm px-3 py-1.5 rounded-lg hover:bg-gray-700"
      >
        Create
      </button>
    </form>
  }

  <div class="bg-white border rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
        <tr>
          <th class="px-4 py-3 text-left">Username</th>
          <th class="px-4 py-3 text-left">Role</th>
          <th class="px-4 py-3 text-left">Status</th>
          <th class="px-4 py-3 text-left">Created</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y">
        @for (user of users(); track user.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 font-medium">{{ user.username }}</td>
            <td class="px-4 py-3">
              <span
                class="px-2 py-0.5 rounded-full text-xs font-medium"
                [class]="
                  user.role === 'ADMIN'
                    ? 'bg-purple-100 text-purple-700'
                    : 'bg-gray-100 text-gray-600'
                "
              >
                {{ user.role }}
              </span>
            </td>
            <td class="px-4 py-3">
              <span
                class="px-2 py-0.5 rounded-full text-xs font-medium"
                [class]="user.enabled ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'"
              >
                {{ user.enabled ? 'Active' : 'Disabled' }}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-500">{{ user.created_at | slice: 0 : 10 }}</td>
            <td class="px-4 py-3 text-right">
              <button
                (click)="toggleEnabled(user)"
                class="text-xs text-gray-400 hover:text-gray-900"
              >
                {{ user.enabled ? 'Disable' : 'Enable' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
