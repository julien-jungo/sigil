<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6">Sign in to Sigil</h1>
    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <input
        [(ngModel)]="username"
        name="username"
        type="text"
        placeholder="Username"
        required
        class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      />
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        required
        class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      />
      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }
      <button
        type="submit"
        [disabled]="loading()"
        class="bg-gray-900 text-white rounded-lg py-2 text-sm font-medium hover:bg-gray-700 disabled:opacity-50"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
