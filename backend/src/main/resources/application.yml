server:
  port: ${PORT:8080}

spring:
  application:
    name: sigil
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigil}
    username: ${DB_USER:sigil}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:${PORT:8080}/.well-known/jwks.json

logging:
  level:
    root: WARN
    dev.sigil: INFO
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0

sigil:
  jwt:
    keypair-source: ${JWT_KEYPAIR_SOURCE:generated}
    private-key: ${JWT_PRIVATE_KEY:}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
